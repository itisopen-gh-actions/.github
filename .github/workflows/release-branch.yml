---
name: Release Branch
on:
  push:
    branches:
      - itisopen
      - release/**
    # This .github organization is a special case for the release branch
    # We want to cut releases when github reusable/shared workflows change.
    # So we should not skip .github/** paths
    paths-ignore:
      - 'docs/**'
      - 'examples/**'
      - 'test/**'
      - 'README.*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readme:
    uses: itisopen-gh-actions/.github/.github/workflows/shared-readme.yml@itisopen
    name: "ci"
    with:
      runs-on: '["ubuntu-latest"]'
    secrets: inherit

  release:
    needs: [ readme ]
    name: "ci"
    uses: itisopen-gh-actions/.github/.github/workflows/shared-auto-release.yml@itisopen
    with:
      publish: ${{ inputs.publish }}
    secrets: inherit
