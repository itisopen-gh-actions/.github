name: Scheduled Workflow

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  pull-requests: write
  id-token: write
  contents: read

jobs:
  example-job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check if secret is set
        run: |
          if [ -z "${{ vars.GH_APP_ID }}" ]; then
            echo "vars.GH_APP_ID is not set"
          else
            echo "vars.GH_APP_ID is set"
          fi
          if [ -z "${{ secrets.GH_APP_PRIVATE_KEY }}" ]; then
            echo "secrets.GH_APP_PRIVATE_KEY is not set"
          else
            echo "secrets.GH_APP_PRIVATE_KEY is set"
          fi
      - name: Print all environment variables
        run: env
  readme:
    uses: itisopen-gh-actions/.github/.github/workflows/shared-readme.yml@itisopen
    name: "readme"
    with:
      runs-on: '["ubuntu-latest"]'
    secrets: inherit

  scaffolding:
    runs-on: ubuntu-latest
    environment: security
    steps:
      - name: Run organizational action
        uses: itisopen-gh-actions/.github@v0.4.0
        with:
          github_app_id: ${{ vars.GH_APP_ID }}
          github_app_private_key: ${{ secrets.GH_APP_PRIVATE_KEY }}
